<!DOCTYPE html>
<html>
<head>
  <title>Generate PWA Icons</title>
  <style>
    body { font-family: system-ui; padding: 40px; background: #000; color: #fff; }
    canvas { border: 2px solid #333; margin: 10px; }
    .container { max-width: 800px; margin: 0 auto; }
    button { background: #0070f3; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 10px 5px; }
    button:hover { background: #0051cc; }
    .icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; margin-top: 30px; }
    .icon-item { text-align: center; }
    .icon-item canvas { width: 100%; height: auto; }
    .icon-item p { margin: 10px 0 0; font-size: 14px; color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 PWA Icon Generator</h1>
    <p>Upload your logo/image and generate all required PWA icons</p>
    
    <input type="file" id="upload" accept="image/*" style="margin: 20px 0;">
    <button onclick="generateIcons()">Generate Icons</button>
    <button onclick="downloadAll()">Download All</button>
    
    <div class="icons" id="icons"></div>
  </div>

  <script>
    const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
    let sourceImage = null;
    const canvases = {};

    document.getElementById('upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          sourceImage = img;
          console.log('Image loaded:', img.width, 'x', img.height);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function generateIcons() {
      if (!sourceImage) {
        alert('Please upload an image first!');
        return;
      }

      const container = document.getElementById('icons');
      container.innerHTML = '';

      sizes.forEach(size => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // Fill with black background
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, size, size);

        // Draw image centered and scaled
        const scale = Math.min(size / sourceImage.width, size / sourceImage.height) * 0.8;
        const w = sourceImage.width * scale;
        const h = sourceImage.height * scale;
        const x = (size - w) / 2;
        const y = (size - h) / 2;

        ctx.drawImage(sourceImage, x, y, w, h);

        // Add rounded corners for maskable icons
        if (size >= 192) {
          ctx.globalCompositeOperation = 'destination-in';
          ctx.beginPath();
          ctx.roundRect(0, 0, size, size, size * 0.1);
          ctx.fill();
          ctx.globalCompositeOperation = 'source-over';
        }

        canvases[size] = canvas;

        const item = document.createElement('div');
        item.className = 'icon-item';
        item.innerHTML = `
          <canvas width="${size}" height="${size}"></canvas>
          <p>${size}x${size}</p>
          <button onclick="download(${size})">Download</button>
        `;
        const itemCanvas = item.querySelector('canvas');
        itemCanvas.getContext('2d').drawImage(canvas, 0, 0);
        container.appendChild(item);
      });

      console.log('Icons generated!');
    }

    function download(size) {
      const canvas = canvases[size];
      if (!canvas) return;

      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon-${size}.png`;
        a.click();
        URL.revokeObjectURL(url);
      });
    }

    function downloadAll() {
      sizes.forEach((size, index) => {
        setTimeout(() => download(size), index * 200);
      });
    }
  </script>
</body>
</html>
